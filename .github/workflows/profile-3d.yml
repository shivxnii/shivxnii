
name: Generate 3D GitHub Contributions

on:
  schedule:
    # Every day at 12:00 AM IST (18:30 UTC)
    - cron: "30 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate 3D Contribution Calendar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit Generated Images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No changes in contribution images."
          else
            git commit -m "chore: update 3D contribution calendar"
            git push
          fi
